version: '3.9'

services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    develop:
      watch:
        - path: ./api
          target: /app
    env_file:
      - ./api/.env

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    develop:
      watch:
        - path: ./frontend
          target: /app
    depends_on:
      - api

